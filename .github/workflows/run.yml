name: Build V2Ray rules dat files # 构建 V2Ray 规则数据文件

on:
  workflow_dispatch: # 手动触发
  push:
    branches:
      - main # 分支有推送时触发
    paths:
      - "**/userlist" # 文件的变动时触发
  schedule:
    - cron: "0 22 * * *" # 每天 22:00 自动触发
jobs:
  build:
    runs-on: ubuntu-latest # 使用最新的 Ubuntu 虚拟机
    steps:
      - name: Set variables # 设置环境变量
        run: |
          echo "RELEASE_NAME=Released on $(date +%Y%m%d%H%M)" >> $GITHUB_ENV # 发布名称
          echo "TAG_NAME=$(date +%Y%m%d%H%M)" >> $GITHUB_ENV # 标签名称
        shell: bash

      - name: Checkout the "main" branch of this repo # 检出本仓库的 main 分支
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Checkout v2fly/domain-list-community # 检出社区域名列表仓库
        uses: actions/checkout@v5
        with:
          repository: v2fly/domain-list-community
          path: community

      - name: Setup Go # 安装 Go 语言环境
