name: Build V2Ray rules dat files # 构建 V2Ray 规则数据文件

on:
  workflow_dispatch: # 手动触发
  push:
    branches:
      - main # 分支有推送时触发
    paths:
      - "**/run.yml" # 文件的变动时触发
      - "**/geolocation-!cn"
      - "**/proxy.txt"
      - "**/twitchcdn"
      - "**/speedup"
  schedule:
    - cron: "0 22 * * *" # 每天 22:00 自动触发
jobs:
  build:
    runs-on: ubuntu-latest # 使用最新的 Ubuntu 虚拟机
    steps:
      - name: Set variables # 设置环境变量
        run: |
          echo "RELEASE_NAME=Released on $(date +%Y%m%d%H%M)" >> $GITHUB_ENV # 发布名称
          echo "TAG_NAME=$(date +%Y%m%d%H%M)" >> $GITHUB_ENV # 标签名称
          # 设置各类域名和广告规则的下载链接
          echo "GOOGLE_DOMAINS_URL=https://raw.githubusercontent.com/felixonmars/dnsmasq-china-list/master/google.china.conf" >> $GITHUB_ENV
        shell: bash

      - name: Checkout the "main" branch of this repo # 检出本仓库的 main 分支
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Checkout Loyalsoldier/domain-list-custom # 检出自定义域名列表仓库
        uses: actions/checkout@v5
        with:
          repository: Loyalsoldier/domain-list-custom
          path: custom

      - name: Checkout v2fly/domain-list-community # 检出社区域名列表仓库
        uses: actions/checkout@v5
        with:
          repository: v2fly/domain-list-community
          path: community

      - name: Setup Go # 安装 Go 语言环境
        uses: actions/setup-go@v6
        with:
          go-version-file: ./custom/go.mod
          cache-dependency-path: ./custom/go.sum

      - name: Remove redundant domains
        run: |
          cp ./include.py ./community/data/include.py
          \cp -f ./geolocation-\!cn ./community/data/geolocation-\!cn
          \cp -f ./geolocation-cn ./community/data/geolocation-cn
          cp ./userproxy ./community/data/
          sed -i '/include:mihoyo/d' ./community/data/category-entertainment
          sed -i '/include:category-games-!cn/d' ./community/data/category-entertainment
          sed -i '/amp-api.podcast.apple.com/d' ./community/data/category-entertainment
          sed -i '/bag.itunes.apple.com/d' ./community/data/category-entertainment
          sed -i '/bookeeper.itunes.apple.com/d' ./community/data/category-entertainment
          find ./community/data/ -type f ! -name "google" ! -name "include.py" -exec grep -H "@cn" {} + > temp-cn.txt
          sed 's/^[^:]*://' temp-cn.txt >> ./community/data/cn
          find ./community/data/ -type f ! -name "proxylist.txt" ! -name "google" ! -name "cn.txt" ! -name "include.py" -exec sed -i '/@cn/d' {} +
          ls
          cd ./community/data/
          chmod +x include.py
          ./include.py geolocation-\!cn proxylist.txt --remove-cn --keep-include google
          ./include.py geolocation-cn cn.txt
          rm -f ./include.py

      - name: Create `china-list`、`google-cn`、`apple-cn`、`gfw`、`greatfire` lists # 生成各类辅助列表
        run: |
          curl -sSL $GOOGLE_DOMAINS_URL | perl -ne '/^server=\/([^\/]+)\// && print "full:$1\n"' > ./community/data/google-cn
          curl -sSL $GOOGLE_DOMAINS_URL | perl -ne '/^server=\/([^\/]+)\// && print "full:$1\n"' > google-cn.txt
          echo "www.recaptcha.net" >> ./community/data/google-cn
          echo "www.recaptcha.net" >> ./google-cn.txt

      - name: Build geosite.dat file # 构建 geosite.dat 文件
