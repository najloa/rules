name: Build V2Ray rules dat files # 构建 V2Ray 规则数据文件

on:
  workflow_dispatch: # 手动触发
  push:
    branches:
      - main # 分支有推送时触发
    paths:
      - "**/userlist" # 文件的变动时触发
  schedule:
    - cron: "0 22 * * *" # 每天 22:00 自动触发
jobs:
  build:
    runs-on: ubuntu-latest # 使用最新的 Ubuntu 虚拟机
    steps:
      - name: Set variables # 设置环境变量
        run: |
          echo "RELEASE_NAME=Released on $(date +%Y%m%d%H%M)" >> $GITHUB_ENV # 发布名称
          echo "TAG_NAME=$(date +%Y%m%d%H%M)" >> $GITHUB_ENV # 标签名称
        shell: bash

      - name: Checkout the "main" branch of this repo # 检出本仓库的 main 分支
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Checkout v2fly/domain-list-community # 检出社区域名列表仓库
        uses: actions/checkout@v5
        with:
          repository: v2fly/domain-list-community
          path: community

      - name: Setup Go # 安装 Go 语言环境
        uses: actions/setup-go@v6
        with:
          go-version-file: ./community/go.mod
          cache-dependency-path: ./community/go.sum

      - name: Remove redundant domains
        run: |
          \cp -f ./geolocation-\!cn ./community/data/geolocation-\!cn
          \cp -f ./geolocation-cn ./community/data/geolocation-cn
          \cp -f ./userlist ./community/data/userlist
          sed -i '/include:category-games-\!cn/d' ./community/data/category-entertainment
          sed -i '/include:category-entertainment-ru/d' ./community/data/category-entertainment
          sed -i '/include:youtube/d' ./community/data/category-entertainment
          # 赋予执行权限
          chmod +x includetolist.py
          ./includetolist.py -i ./community/data -o ./

      - name: Build geosite.dat file # 构建 geosite.dat 文件
        run: |
          cd community || exit 1
          go run ./

      - name: Move and zip files and generate sha256 hash # 移动、打包及生成校验码
        run: |
          install -Dp ./community/dlc.dat ./publish/geosite.dat
          install -p {proxy,cn,@cn}.txt ./publish/
          cd ./publish || exit 1
          sha256sum geosite.dat > geosite.dat.sha256sum # 生成 geosite.dat 校验

      - name: Release and upload assets # 发布 Release 并上传资产
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          release_name: ${{ env.RELEASE_NAME }}
          tag: ${{ env.TAG_NAME }}
          file_glob: true
          file: ./publish/*

      - name: Git push assets to "release" branch # 推送文件到 release 分支
        run: |
          cd publish || exit 1
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b release
          git add .
          git commit -m "${{ env.RELEASE_NAME }}"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f -u origin release

      - name: Push rules files to public repo
        run: |
          git clone https://x-access-token:${{ secrets.PUBLIC_REPO_TOKEN }}@github.com/najloa/geoip.git public-repo
          cd public-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout rules || git checkout -b rules
          # 清理旧文件
          ls -al
          # 复制新构建文件
          cp -r ../publish/* ./
          echo "$(date +%Y%m%d%H%M%S)" > .update_timestamp
          git add .
          git commit -m "${{ env.RELEASE_NAME }}" || echo "Nothing to commit"
          #git push origin rules
          git push -f origin rules

      #- name: Purge jsdelivr CDN # 刷新 jsdelivr CDN 缓存
      #  run: |
      #    cd publish || exit 1
      #    for file in $(ls); do
      #      curl -i "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/${file}"
      #    done

      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@main
        with:
          retain_days: 0
          keep_minimum_runs: 1

      - name: Remove old Releases
        uses: dev-drprasad/delete-older-releases@master
        with:
          keep_latest: 1
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
