name: Build V2Ray rules dat files

on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set variables # 设置环境变量
        run: |
          echo "RELEASE_NAME=Released on $(date +%Y%m%d%H%M)" >> $GITHUB_ENV
          echo "TAG_NAME=$(date +%Y%m%d%H%M)" >> $GITHUB_ENV
        shell: bash

      - name: Checkout the "main" branch of this repo # 检出本仓库的 main 分支
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Checkout v2fly/domain-list-community # 检出社区域名列表仓库
        uses: actions/checkout@v5
        with:
          repository: v2fly/domain-list-community
          path: community

      - name: Checkout Loyalsoldier/geoip # 检出 GeoIP 项目
        uses: actions/checkout@v5
        with:
          repository: Loyalsoldier/geoip
          path: geoip

      - name: Setup Go # 安装 Go 语言环境
        uses: actions/setup-go@v6
        with:
          go-version-file: ./geoip/go.mod
          cache: true
          cache-dependency-path: |
            ./community/go.sum
            ./geoip/go.sum

      - name: Remove redundant domains
        run: |
          \cp -f ./userlist ./community/data/userlist
          \cp -f ./geolocation-!cn ./community/data/geolocation-!cn
          curl -L "https://cdn.jsdelivr.net/gh/pexcn/daily@gh-pages/gfwlist/gfwlist.txt" -o ./community/data/gfw


          python3 - <<'PY'
          from pathlib import Path
  
          root = Path("./community/data")
          cache = {}
          resolving = set()
  
          def parse_rule(line):
              line = line.split("#", 1)[0].strip()
              if not line:
                  return None
  
              head = line.split()[0]
  
              if head.startswith("include:"):
                  return ("include", head[8:])
  
              if ":" in head:
                  typ, value = head.split(":", 1)
              else:
                  typ, value = "domain", head
  
              typ = typ.lower()
              value = value.lower().rstrip(".")
  
              if typ not in ("domain", "full"):
                  return None
  
              return (typ, value)
  
          def resolve(name):
              name = name.lower()
  
              if name == "gfw":
                  return []
  
              if name in cache:
                  return cache[name]
  
              if name in resolving:
                  raise RuntimeError(f"Circular inclusion: {name}")
  
              path = root / name
              if not path.is_file():
                  raise FileNotFoundError(f"Missing domain list: {path}")
  
              resolving.add(name)
              entries = []
  
              try:
                  for line in path.read_text(encoding="utf-8").splitlines():
                      rule = parse_rule(line)
                      if not rule:
                          continue
  
                      typ, value = rule
  
                      if typ == "include":
                          if value.lower() != "gfw":
                              entries.extend(resolve(value))
                      else:
                          entries.append(rule)
              finally:
                  resolving.remove(name)
  
              cache[name] = entries
              return entries
  
          rules = (
              resolve("geolocation-!cn")
              + resolve("cn")
          )
  
          def is_covered(domain):
              for typ, parent in rules:
                  if domain == parent:
                      return True
  
                  if typ == "domain" and domain.endswith("." + parent):
                      return True
  
              return False
  
          gfw = root / "gfw"
          original = gfw.read_text(encoding="utf-8").splitlines(keepends=True)
  
          filtered = []
          removed = 0
  
          for line in original:
              rule = parse_rule(line)
  
              if rule and rule[0] in ("domain", "full"):
                  if is_covered(rule[1]):
                      removed += 1
                      continue
  
              filtered.append(line)
  
          gfw.write_text("".join(filtered), encoding="utf-8")
  
          print(f"Loaded domain rules: {len(rules)}")
          print(f"Removed redundant GFW domains: {removed}")
          print(f"Remaining GFW lines: {len(filtered)}")
          PY


      - name: Build geosite.dat file # 构建 geosite.dat 文件
        run: |
          \cp -f ./dat_diy.json ./community/dat_diy.json
          cd community || exit 1
          go run ./main.go --datprofile='./dat_diy.json'

      - name: Build customized geoip.dat file # 构建定制 GeoIP 文件
        run: |
          cd geoip || exit 1

          cat > config.json <<'EOF'
          {
            "input": [
              {
                "type": "text",
                "action": "add",
                "args": {
                  "name": "cn",
                  "uri": "https://raw.githubusercontent.com/gaoyifan/china-operator-ip/ip-lists/china.txt",
                  "onlyIPType": "ipv4"
                }
              },
              {
                "type": "text",
                "action": "add",
                "args": {
                  "name": "cn",
                  "uri": "https://raw.githubusercontent.com/gaoyifan/china-operator-ip/ip-lists/china6.txt",
                  "onlyIPType": "ipv6"
                }
              },
              {
                "type": "text",
                "action": "add",
                "args": {
                  "name": "telegram",
                  "uri": "https://core.telegram.org/resources/cidr.txt"
                }
              },
              {
                "type": "private",
                "action": "add"
              }
            ],
            "output": [
              {
                "type": "v2rayGeoIPDat",
                "action": "output",
                "args": {
                  "outputDir": "./output",
                  "outputName": "geoip.dat",
                  "wantedList": [
                    "cn",
                    "private",
                    "telegram"
                  ]
                }
              }
            ]
          }
          EOF

          go run ./ convert -c ./config.json

          test -s ./output/geoip.dat || {
            echo "Error: geoip.dat was not generated!"
            exit 1
          }

      - name: Move and generate sha256 hash # 移动文件及生成校验码
        run: |
          install -Dp ./community/dlc.dat ./publish/geosite.dat
          install -Dp ./geoip/output/geoip.dat ./publish/geoip.dat

          cd ./publish || exit 1
          sha256sum geosite.dat > geosite.dat.sha256sum
          sha256sum geoip.dat > geoip.dat.sha256sum

      - name: Release and upload assets # 发布 Release 并上传资产
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          release_name: ${{ env.RELEASE_NAME }}
          tag: ${{ env.TAG_NAME }}
          file_glob: true
          file: ./publish/*

      - name: Git push assets to "release" branch # 推送文件到 release 分支
        run: |
          cd publish || exit 1
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b release
          git add .
          git commit -m "${{ env.RELEASE_NAME }}"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f -u origin release

