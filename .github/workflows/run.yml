      - name: Move and zip files and generate sha256 hash # 移动、打包及生成校验码
        run: |
          install -Dp ./custom/publish/geosite.dat ./publish/geosite.dat
          install -Dp ./community/data/proxylist.txt ./publish/proxylist.txt
          install -p google-cn.txt ./publish/
          install -p cn.txt ./publish/
          cd ./publish || exit 1
          sha256sum geosite.dat > geosite.dat.sha256sum # 生成 geosite.dat 校验

      - name: Release and upload assets # 发布 Release 并上传资产
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          release_name: ${{ env.RELEASE_NAME }}
          tag: ${{ env.TAG_NAME }}
          file_glob: true
          file: ./publish/*

      - name: Git push assets to "release" branch # 推送文件到 release 分支
        run: |
          cd publish || exit 1
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b release
          git add .
          git commit -m "${{ env.RELEASE_NAME }}"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f -u origin release

      - name: Push rules files to public repo
        run: |
          git clone https://x-access-token:${{ secrets.PUBLIC_REPO_TOKEN }}@github.com/najloa/geoip.git public-repo
          cd public-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout rules || git checkout -b rules
          # 清理旧文件
          ls -al
          # 复制新构建文件
          cp -r ../publish/* ./
          git add .
          git commit -m "${{ env.RELEASE_NAME }}" || echo "Nothing to commit"
          #git push origin rules
          git push -f origin rules

      #- name: Purge jsdelivr CDN # 刷新 jsdelivr CDN 缓存
