name: Manual Upload to geoip

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name of the release to sync"
        required: true

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Install GitHub CLI
        run: sudo apt-get install -y gh

      - name: Authenticate gh CLI
        run: gh auth login --with-token <<< "${{ secrets.GITHUB_TOKEN }}"

      - name: Download release assets from private repo
        run: |
          mkdir release_assets
          cd release_assets
          gh release download "${{ github.event.inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "*" \
            --clobber

      - name: Upload assets to najloa/geoip
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: "Synced from private repo"
          body: "Manual sync from private repo"
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          repository: najloa/geoip
          files: |
            release_assets/*
