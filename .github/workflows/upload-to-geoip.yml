name: Sync to geoip/release-branch

on:
  workflow_dispatch:  # 或者 schedule、push、build 完成后等你希望触发的时机

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4

      - name: Prepare release files
        run: |
          mkdir -p ./out
          cp ./publish/* ./out/

      - name: Clone target public repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git clone --depth=1 https://x-access-token:${{ secrets.PUBLIC_REPO_TOKEN }}@github.com/najloa/geoip.git target_repo
          cd target_repo
          git checkout -B release  # 切到 release 分支，或创建

      - name: Push files to release branch
        run: |
          cd target_repo
          rm -rf *
          cp -r ../out/* ./
          git add .
          git commit -m "Update release files $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "No changes to commit"
          git push origin release
