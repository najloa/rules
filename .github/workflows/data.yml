name: Merge domain files to main

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'  # 每天凌晨执行，可修改

jobs:
  merge-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v3
        with:
          ref: main

      - name: Clone domain-list-community
        run: |
          git clone --depth=1 https://github.com/v2fly/domain-list-community.git

      - name: Merge selected files with include support
        run: |
          mkdir -p publish
          DATA_DIR="domain-list-community/data"
          OUTPUT_RAW="publish/merged_output_raw.txt"
          > "$OUTPUT_RAW"

          declare -A processed

          process_file() {
            local name="$1"

            if [[ -n "${processed[$name]}" ]]; then
              return 0
            fi
            processed[$name]=1

            local path="$DATA_DIR/$name"
            if [[ ! -f "$path" ]]; then
              echo "::warning:: Skipping missing file: $path"
              return 0
            fi

            while IFS= read -r line || [[ -n "$line" ]]; do
              if [[ "$line" =~ ^include:([a-zA-Z0-9._-]+)$ ]]; then
                include_name="${BASH_REMATCH[1]}"
                process_file "$include_name"
              else
                echo "$line" >> "$OUTPUT_RAW"
              fi
            done < "$path"
          }

          # Entry point file(s)
          FILES=("google")  # 👈 入口文件名

          for file in "${FILES[@]}"; do
            process_file "$file"
          done

          # Clean and format final output
          awk '
            /^[[:space:]]*$/ { next }             # Skip empty lines
            /^[[:space:]]*#/ { next }             # Skip full-line comments
            {
              sub(/[[:space:]]*#.*$/, "")         # Remove inline comments
              gsub(/[[:space:]]+/, "")            # Remove all whitespace
              print
            }
          ' "$OUTPUT_RAW" | sort -u > publish/merged_output.txt

      - name: Commit and push merged_output.txt to main
        run: |
          cp publish/merged_output.txt .

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add merged_output.txt

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto update merged_output.txt"
            git push origin main
          fi
