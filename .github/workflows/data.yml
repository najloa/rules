name: 代理域名列表

on:
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * *'  # 每天执行
  push:
    branches:
      - main
    paths:
      - "**/data.yml"
jobs:
  merge-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v3
        with:
          ref: main

      - name: Clone domain-list-community
        run: |
          git clone --depth=1 https://github.com/v2fly/domain-list-community.git

      - name: Merge and clean domain files
        run: |
          mkdir -p publish
          DATA_DIR="domain-list-community/data"
          OUTPUT_RAW="publish/geolocation-\!cn_raw"
          > "$OUTPUT_RAW"

          declare -A processed
          declare -A deletecnmap

          # ⬇️ 配置你的合并源文件
          FILES=("category-media" "google" "openai" "github" "steam" "twitch" "yandex" "tiktok" "vimeo" "reddit" "meta" "x" "telegram" "demonoid" "piratebay" "btdig" "nyaa" "jwplayer" "pikpak" "category-vpnservices" "pixiv" "1337x" "rarbg" "dmm" "vk" "z-library" "netflix" "yahoo" "category-public-tracker" "category-porn" "category-forums" "4plebs" "category-anticensorship" "mega" "bluesky" "linkedin" "primevideo" "soundcloud" "niconico" "bandcamp" "imgur" "streamable" "rumble" "dropbox" "wikimedia") # 👈 入口文件名
          deletecn=("category-entertainment" "linkedin" "digicert" "epicgames" "apple-pki" "microsoft" "ubisoft" "xbox" "bing" "steam" "apple")  # 这些文件中含 @cn 的行将被整行删除

          # 构建 deletecn 快速查找表
          for dfile in "${deletecn[@]}"; do
            deletecnmap[$dfile]=1
          done

          process_file() {
            local name="$1"
            if [[ -n "${processed[$name]}" ]]; then return 0; fi
            processed[$name]=1

            local path="$DATA_DIR/$name"
            if [[ ! -f "$path" ]]; then
              echo "::warning:: Skipping missing file: $path"
              return 0
            fi

            local temp_clean="/tmp/cleaned_$name.txt"
            > "$temp_clean"

            while IFS= read -r line || [[ -n "$line" ]]; do
              if [[ "$line" =~ ^include:([a-zA-Z0-9._-]+)$ ]]; then
                include_name="${BASH_REMATCH[1]}"
                process_file "$include_name"
              else
                # 删除 @cn 行（仅对指定文件）
                if [[ -n "${deletecnmap[$name]}" && "$line" == *@cn* ]]; then
                  continue
                fi
                echo "$line" >> "$temp_clean"
              fi
            done < "$path"

            cat "$temp_clean" >> "$OUTPUT_RAW"
            rm -f "$temp_clean"
          }

          for file in "${FILES[@]}"; do
            process_file "$file"
          done

          # ⬇️ 清洗输出：去空行、注释、@后内容、空格，排序去重
          awk '
            /^[[:space:]]*$/ { next }
            /^[[:space:]]*#/ { next }
            {
              sub(/[[:space:]]*#.*$/, "")
              sub(/@.*/, "")
              gsub(/[[:space:]]+/, "")
              print
            }
          ' "$OUTPUT_RAW" | sort -u > publish/geolocation-\!cn

      - name: Commit and push geolocation-!cn
        run: |
          cp publish/geolocation-\!cn .

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add geolocation-\!cn

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto update geolocation-\!cn"
            git push -u origin main
          fi

      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@main
        with:
          retain_days: 0
          keep_minimum_runs: 1

      - name: Remove old Releases
        uses: dev-drprasad/delete-older-releases@master
        with:
          keep_latest: 1
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
