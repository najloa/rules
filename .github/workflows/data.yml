name: 代理域名列表

on:
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * *'  # 每天执行
  push:
    branches:
      - main
    paths:
      - "**/data.yml"
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4

      - name: Clone domain-list-community
        run: |
          git clone --depth=1 https://github.com/v2fly/domain-list-community.git

      - name: Merge and clean domain files
        run: |
          set -euo pipefail

          mkdir -p publish
          DATA_DIR="domain-list-community/data"
          OUTPUT_RAW="publish/geolocation-!cn_raw"
          OUTPUT_FINAL="publish/geolocation-!cn"

          > "$OUTPUT_RAW"

          declare -A processed
          declare -A deletecnmap
          declare -a buffer

          FILES=(
            category-entertainment category-media category-vpnservices category-porn
            category-forums category-anticensorship google openai github steam
            yandex reddit meta x telegram demonoid piratebay btdig nyaa jwplayer
            pikpak 1337x rarbg dmm vk z-library netflix yahoo 4plebs mega bluesky
            linkedin primevideo imgur streamable rumble wikimedia
          )

          deletecnlist=(
            category-entertainment category-media category-vpnservices
            category-porn category-forums category-anticensorship
            linkedin steam
          )

          for fname in "${deletecnlist[@]}"; do deletecnmap["$fname"]=1; done

          process_file() {
            local name="$1"
            local delete_cn_flag="$2"

            if [[ -n "${processed[$name]:-}" ]]; then return 0; fi
            processed["$name"]=1

            local filepath="$DATA_DIR/$name"
            if [[ ! -f "$filepath" ]]; then
              echo "::warning:: Skipping missing file: $filepath"
              return 0
            fi

            [[ -n "${deletecnmap[$name]:-}" ]] && delete_cn_flag=1

            while IFS= read -r line || [[ -n "$line" ]]; do
              line="${line%%[[:space:]]#*}"
              line="${line//[[:space:]]/}"
              [[ -z "$line" ]] && continue

              if [[ "$line" =~ ^include:([a-zA-Z0-9._-]+)$ ]]; then
                child="${BASH_REMATCH[1]}"
                process_file "$child" "$delete_cn_flag"
              elif [[ "$delete_cn_flag" -eq 1 && "$line" == *@cn* ]]; then
                continue
              else
                buffer+=("$line")
              fi
            done < "$filepath"

            echo "✓ Processed $name"
          }

          for entry in "${FILES[@]}"; do
            process_file "$entry" 0
          done

          printf "%s\n" "${buffer[@]}" |
            sed -E '/^\s*$/d; s/@.*//; s/\s+//g' |
            grep -v '^#' |
            sort -u > "$OUTPUT_FINAL"
#' "$OUTPUT_RAW" | sort -u > publish/geolocation-\!cn

      - name: Commit and push geolocation-!cn
        run: |
          cp publish/geolocation-\!cn .

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add geolocation-\!cn

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto update geolocation-\!cn"
            git push -u origin main
          fi

      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@main
        with:
          retain_days: 0
          keep_minimum_runs: 1

      - name: Remove old Releases
        uses: dev-drprasad/delete-older-releases@master
        with:
          keep_latest: 1
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
