name: v2fly/domain-list-community

on:
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * *'  # 每天执行，可修改

  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"
      - "**/merged_output.txt"
      - "**/run.yml"
jobs:
  merge-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v3
        with:
          ref: main

      - name: Clone domain-list-community
        run: |
          git clone --depth=1 https://github.com/v2fly/domain-list-community.git

      - name: Merge and clean domain files
        run: |
          mkdir -p publish
          DATA_DIR="domain-list-community/data"
          OUTPUT_RAW="publish/merged_output_raw.txt"
          > "$OUTPUT_RAW"

          declare -A processed
          declare -A deletecnmap

          # ⬇️ 配置你的合并源文件
          FILES=("google" "openai" "github" "twitch" "yandex" "tiktok" "vimeo" "reddit" "meta" "x" "telegram" "demonoid" "piratebay" "btdig" "theguardian" "nyaa" "jwplayer" "nytimes" "cnn" "pikpak" "category-vpnservices" "pixiv" "1337x" "dailymail" "rarbg" "dmm" "vk" "appledaily" "z-library" "netflix" "bbc" "ft" "bloomberg" "newscorp" "yahoo" "fox" "category-public-tracker" "category-porn" "category-forums" "4plebs" "category-anticensorship" "mega" "bluesky" "linkedin" "primevideo" "soundcloud" "niconico" "bandcamp") # 👈 入口文件名
          deletecn=("linkedin" "digicert" "epicgames" "apple-pki" "microsoft" "ubisoft" "xbox" "bing" "steam" "apple")  # 这些文件中含 @cn 的行将被整行删除

          # 构建 deletecn 快速查找表
          for dfile in "${deletecn[@]}"; do
            deletecnmap[$dfile]=1
          done

          process_file() {
            local name="$1"
            if [[ -n "${processed[$name]}" ]]; then return 0; fi
            processed[$name]=1

            local path="$DATA_DIR/$name"
            if [[ ! -f "$path" ]]; then
              echo "::warning:: Skipping missing file: $path"
              return 0
            fi

            local temp_clean="/tmp/cleaned_$name.txt"
            > "$temp_clean"

            while IFS= read -r line || [[ -n "$line" ]]; do
              if [[ "$line" =~ ^include:([a-zA-Z0-9._-]+)$ ]]; then
                include_name="${BASH_REMATCH[1]}"
                process_file "$include_name"
              else
                # 删除 @cn 行（仅对指定文件）
                if [[ -n "${deletecnmap[$name]}" && "$line" == *@cn* ]]; then
                  continue
                fi
                echo "$line" >> "$temp_clean"
              fi
            done < "$path"

            cat "$temp_clean" >> "$OUTPUT_RAW"
            rm -f "$temp_clean"
          }

          for file in "${FILES[@]}"; do
            process_file "$file"
          done

          # ⬇️ 清洗输出：去空行、注释、@后内容、空格，排序去重
          awk '
            /^[[:space:]]*$/ { next }
            /^[[:space:]]*#/ { next }
            {
              sub(/[[:space:]]*#.*$/, "")
              sub(/@.*/, "")
              gsub(/[[:space:]]+/, "")
              print
            }
          ' "$OUTPUT_RAW" | sort -u > publish/merged_output.txt
          ls -la publish/

      - name: Set up Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: Checkout hidden branch or create it
        run: |
          if git fetch origin hidden; then
            git checkout hidden
          else
            git checkout --orphan hidden
            git reset
          fi

      - name: Copy merged file and commit changes
        run: |
          cp publish/merged_hidden.txt ./
          git add ./merged_hidden.txt
          git diff --cached --quiet || git commit -m "Update merged domain list $(date +'%Y-%m-%d %H:%M')"

      - name: Push to remote hidden branch
        run: |
          git push origin hidden --force

      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@main
        with:
          retain_days: 0
          keep_minimum_runs: 1

      - name: Remove old Releases
        uses: dev-drprasad/delete-older-releases@master
        with:
          keep_latest: 1
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
