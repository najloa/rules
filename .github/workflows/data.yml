name: Merge domain files to main

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

jobs:
  merge-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v3
        with:
          ref: main

      - name: Clone domain-list-community
        run: |
          git clone --depth=1 https://github.com/v2fly/domain-list-community.git

      - name: Merge selected files into merged_output.txt
        run: |
          mkdir -p publish
          FILES=("google" "facebook" "twitter")  # ← 修改为你需要的文件名
          > publish/merged_output.txt

          for file in "${FILES[@]}"; do
            path="domain-list-community/data/$file"
            if [ -f "$path" ]; then
              echo "# --- Start of $file ---" >> publish/merged_output.txt
              cat "$path" >> publish/merged_output.txt
              echo -e "\n# --- End of $file ---\n" >> publish/merged_output.txt
            else
              echo "::warning:: Missing file: $path"
            fi
          done

      - name: Commit and push merged_output.txt to main
        run: |
          cp publish/merged_output.txt .

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add merged_output.txt

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto update merged_output.txt"
            git push origin main
          fi
