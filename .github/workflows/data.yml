name: Merge domain files to main

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'  # 每天运行，可根据需要修改

jobs:
  merge-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v3
        with:
          ref: main

      - name: Clone domain-list-community
        run: |
          git clone --depth=1 https://github.com/v2fly/domain-list-community.git

      - name: Merge selected files into merged_output.txt
        run: |
          mkdir -p publish
          FILES=("google" "facebook" "twitter")  # ← 修改为你想合并的文件
          > publish/merged_output_raw.txt

          for file in "${FILES[@]}"; do
            path="domain-list-community/data/$file"
            if [ -f "$path" ]; then
              cat "$path" >> publish/merged_output_raw.txt
              echo >> publish/merged_output_raw.txt
            else
              echo "::warning:: Missing file: $path"
            fi
          done

      - name: Clean merged_output.txt (strip comments, empty lines)
        run: |
          awk '
            /^[[:space:]]*$/ { next }             # 跳过空行
            /^[[:space:]]*#/ { next }             # 跳过注释行
            {
              sub(/[[:space:]]*#.*$/, "")         # 去掉尾部注释
              #gsub(/[[:space:]]+/, "")            # 去掉所有空白字符（可选）
              print
            }
          ' publish/merged_output_raw.txt > publish/merged_output.txt

      - name: Commit and push merged_output.txt to main
        run: |
          cp publish/merged_output.txt .

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add merged_output.txt

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto update merged_output.txt"
            git push origin main
          fi
